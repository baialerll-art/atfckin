name: ArityFlow Daily Check-in

on:
  schedule:
    # 北京时间每天 00:12 = UTC 16:12
    - cron: "12 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arityflow-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run check-in
        id: checkin
        env:
          ARITYFLOW_USERNAME: ${{ secrets.ARITYFLOW_USERNAME }}
          ARITYFLOW_PASSWORD: ${{ secrets.ARITYFLOW_PASSWORD }}
          ARITYFLOW_BASE_URL: ${{ vars.ARITYFLOW_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUOTA_DIVISOR: ${{ vars.QUOTA_DIVISOR }}
          CHECKIN_OUT_DIR: artifacts
        run: python scripts/checkin.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arityflow-checkin-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
